<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pujazo</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #06140f;
        --panel: #0a1c14;
        --lime: #9fd400;
        --cta: #eef8b8;
        --foam: #e8f5ef;
        --mist: #a7c4b5;
        --ink: #f4fff8;
        --on-lime: #04110c;
        --line: rgba(159, 212, 0, 0.28);
        --err: #ff8f75;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 320px;
        font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
        background: radial-gradient(
            120% 80% at 10% 0%,
            rgba(159, 212, 0, 0.12),
            transparent 55%
          ),
          var(--bg);
        color: var(--foam);
      }
      header {
        padding: 14px 14px 10px;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 10px;
        align-items: center;
      }
      header img {
        width: 36px;
        height: 36px;
        border-radius: 9px;
        flex-shrink: 0;
      }
      h1 {
        margin: 0;
        font-size: 18px;
        color: var(--ink);
        letter-spacing: -0.02em;
      }
      header p {
        margin: 2px 0 0;
        color: var(--mist);
        font-size: 12px;
      }
      main {
        padding: 12px 14px 14px;
        display: grid;
        gap: 10px;
      }
      label {
        display: grid;
        gap: 4px;
        font-size: 12px;
        color: var(--mist);
      }
      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--ink);
        padding: 8px 10px;
        font-size: 13px;
      }
      input:focus {
        outline: 2px solid rgba(159, 212, 0, 0.45);
        outline-offset: 1px;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 8px;
        padding: 10px 12px;
        font-weight: 700;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.55;
        cursor: wait;
      }
      .primary {
        background: var(--cta);
        color: var(--on-lime);
      }
      .primary:hover:not(:disabled) {
        filter: brightness(1.05);
      }
      .secondary {
        background: transparent;
        color: var(--foam);
        border: 1px solid var(--line);
      }
      #status {
        min-height: 1.2em;
        font-size: 12px;
        color: var(--mist);
        white-space: pre-wrap;
      }
      #status.ok {
        color: var(--lime);
      }
      #status.err {
        color: var(--err);
      }
      .hint {
        font-size: 11px;
        color: var(--mist);
        margin: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon48.png" width="36" height="36" alt="" />
      <div>
        <h1>Pujazo</h1>
        <p>Copia plantilla o mercado desde Biwenger web.</p>
      </div>
    </header>
    <main>
      <label>
        URL de tu Pujazo
        <input
          id="pujazoUrl"
          type="url"
          placeholder="https://pujazo.vercel.app"
          spellcheck="false"
          autocomplete="url"
        />
      </label>
      <button type="button" class="primary" id="btnCopyOpen">
        Copiar y abrir Pujazo
      </button>
      <button type="button" class="secondary" id="btnCopyOnly">
        Solo copiar texto
      </button>
      <p id="status" role="status"></p>
      <p class="hint">
        Abre Biwenger en Plantilla o Mercado, luego pulsa el botón. Por defecto
        usa https://pujazo.vercel.app (cámbiala si tienes otro despliegue).
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
